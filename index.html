<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="color-scheme" content="light" />
<title>S Bank — Виртуальный банк</title>

<!-- Библиотеки -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root {
    color-scheme: light;
    --green: #00A651;
    --green-dark: #007A3D;
    --green-light: #E6F7EE;
    --yellow: #FFC800;
    --yellow-dark: #E0AE00;
    --yellow-light: #FFF7DB;
    --white: #FFFFFF;
    --gray: #F4F6F5;
    --gray-2: #E8EDEA;
    --text: #0F1A14;
    --muted: #6B7A72;
    --red: #E53935;
    --shadow: 0 6px 24px rgba(0, 122, 61, 0.08);
    --shadow-lg: 0 20px 40px rgba(0, 60, 30, 0.15);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--gray); color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .screen { display: none; height: 100vh; overflow-y: auto; }
  .screen.active { display: block; }
  button { font-family: inherit; cursor: pointer; border: none; outline: none; }
  input, select { font-family: inherit; outline: none; border: none; }

  /* ====== ЛОГОТИП ====== */
  .coin-logo {
    --size: 100px;
    width: var(--size); height: var(--size);
    position: relative; perspective: 800px; flex-shrink: 0;
  }
  .coin-logo .coin-spin {
    width: 100%; height: 100%; position: relative;
    transform-style: preserve-3d;
    animation: coinspin 3.5s linear infinite;
  }
  @keyframes coinspin { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
  .coin-logo .face {
    position: absolute; inset: 0; border-radius: 50%;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 32% 28%, #FFF9C4 0%, #FFE066 20%, #FFC800 55%, #E0AE00 85%, #B8860B 100%);
    box-shadow: inset 0 0 0 calc(var(--size) * 0.04) #FFD54F, inset 0 0 0 calc(var(--size) * 0.06) #FFF9C4, 0 0 calc(var(--size) * 0.2) rgba(255, 200, 0, 0.4);
  }
  .coin-logo .face.front { transform: translateZ(5px); }
  .coin-logo .face.back { transform: rotateY(180deg) translateZ(5px); }
  .coin-logo .face.back .S { transform: scaleX(-1); }
  .coin-logo .S {
    font-family: Georgia, serif; font-size: calc(var(--size) * 0.58);
    font-weight: 900; color: #00A651; line-height: 1;
    text-shadow: 0 2px 0 #007A3D, 0 3px 0 #006D36, 0 4px 6px rgba(0,0,0,0.3);
    user-select: none;
  }

  /* ====== АВТОРИЗАЦИЯ ====== */
  .auth-wrap {
    min-height: 100vh; background: radial-gradient(circle at 50% 20%, #F8FCF9 0%, #E6F7EE 60%, #C8EBD5 100%);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .auth-card {
    background: white; border-radius: 24px; padding: 30px 24px;
    box-shadow: var(--shadow-lg); width: 100%; max-width: 360px; text-align: center;
  }
  .auth-card h2 { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
  .auth-card p { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  .input-group { margin-bottom: 14px; text-align: left; }
  .input-group label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .input-group input { width: 100%; padding: 14px; border: 2px solid var(--gray-2); border-radius: 12px; font-size: 15px; background: var(--gray); transition: 0.2s; }
  .input-group input:focus { border-color: var(--green); background: white; }
  
  .btn { padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 800; width: 100%; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
  .btn-primary { background: linear-gradient(135deg, var(--green), var(--green-dark)); color: white; box-shadow: 0 8px 20px rgba(0, 166, 81, 0.3); }
  .btn-primary:active { transform: scale(0.98); }

  /* ====== PIN ====== */
  .pin-container { text-align: center; }
  .pin-dots { display: flex; justify-content: center; gap: 16px; margin: 30px 0; }
  .pin-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--green); transition: 0.2s; }
  .pin-dot.filled { background: var(--green); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
  .pin-key { background: white; border-radius: 16px; padding: 18px; font-size: 24px; font-weight: 800; box-shadow: var(--shadow); transition: 0.1s; }
  .pin-key:active { background: var(--green-light); transform: scale(0.95); }
  .pin-key.empty { background: transparent; box-shadow: none; pointer-events: none; }
  .pin-key.del { color: var(--red); font-size: 20px; }
  .pin-error { color: var(--red); font-size: 13px; font-weight: 600; margin-top: 16px; min-height: 18px; }

  /* ====== ГЛАВНЫЙ ЭКРАН ====== */
  #scr-app { padding-bottom: 90px; background: var(--gray); }
  .bank-header {
    background: linear-gradient(135deg, var(--green), var(--green-dark));
    color: white; padding: 18px 20px 60px; border-radius: 0 0 28px 28px; position: relative;
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; margin-bottom: 20px; }
  .brand-row { display: flex; align-items: center; gap: 10px; }
  .brand-row .coin-logo { --size: 32px; }
  .brand-name { font-weight: 800; font-size: 18px; letter-spacing: -0.3px; }
  .logout-btn { background: rgba(255,255,255,0.15); color: white; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  
  .balance-block { position: relative; z-index: 1; }
  .balance-label { font-size: 12px; text-transform: uppercase; opacity: 0.8; letter-spacing: 1px; }
  .balance-value { font-size: 34px; font-weight: 900; letter-spacing: -1px; margin-top: 2px; }

  .views { margin-top: -30px; position: relative; z-index: 2; padding: 0 16px; }
  .view { display: none; }
  .view.active { display: block; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

  .section-title { font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 12px; }
  .section-title:first-child { margin-top: 0; }

  /* Карты */
  .vcard {
    background: linear-gradient(135deg, #00B85C, #007A3D);
    color: white; border-radius: 16px; padding: 18px; margin-bottom: 12px;
    box-shadow: 0 10px 24px rgba(0, 122, 61, 0.25); position: relative; overflow: hidden;
  }
  .vcard.negative { background: linear-gradient(135deg, #C62828, #8E0000); }
  .vc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: relative; z-index: 1; }
  .vc-name { font-weight: 700; font-size: 13px; opacity: 0.9; }
  .vc-delete { background: rgba(255,255,255,0.2); border-radius: 6px; padding: 4px 8px; font-size: 10px; font-weight: 700; cursor: pointer; }
  .vc-number { font-family: monospace; font-size: 15px; letter-spacing: 2px; margin-bottom: 12px; position: relative; z-index: 1; }
  .vc-balance { font-size: 22px; font-weight: 900; position: relative; z-index: 1; }
  .create-card-btn { width: 100%; padding: 18px; border-radius: 16px; border: 2px dashed var(--green); background: transparent; color: var(--green); font-weight: 800; font-size: 14px; }

  /* Биржа */
  .tab-switcher { display: flex; background: white; border-radius: 12px; padding: 4px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .tab-switcher button { flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; background: transparent; color: var(--muted); transition: 0.2s; }
  .tab-switcher button.active { background: var(--green); color: white; }
  
  #chart-container { width: 100%; height: 220px; background: white; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden; position: relative; }
  
  .asset-item { display: flex; align-items: center; gap: 12px; background: white; border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; box-shadow: var(--shadow); cursor: pointer; transition: 0.1s; }
  .asset-item:active { transform: scale(0.99); }
  .asset-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--green-light); color: var(--green); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
  .asset-info { flex: 1; }
  .asset-symbol { font-weight: 800; font-size: 14px; }
  .asset-price { text-align: right; }
  .asset-price-value { font-weight: 800; font-size: 14px; }

  /* Заявки */
  .order-item { background: white; border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .order-head { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 800; font-size: 14px; }
  .order-body { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 12px; }
  .order-btn { width: 100%; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 12px; transition: 0.1s; }
  .order-btn:active { transform: scale(0.98); }
  .order-btn.free { background: var(--green-light); color: var(--green-dark); }
  .order-btn.fee { background: var(--yellow-light); color: #7A5A00; }

  /* Профиль */
  .profile-card { background: white; border-radius: 16px; padding: 20px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--yellow); color: var(--green-dark); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; }
  .top-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--gray-2); }
  .top-rank { width: 24px; font-weight: 800; color: var(--muted); font-size: 14px; }
  .top-name { flex: 1; font-weight: 700; font-size: 13px; }
  .top-balance { font-weight: 800; font-size: 13px; color: var(--green); }
  .top-you { background: var(--green-light); padding: 10px; border-radius: 8px; margin: 0 -10px; }

  /* Меню */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; padding: 10px 0 16px; box-shadow: 0 -4px 20px rgba(0,0,0,0.06); z-index: 50; }
  .nav-btn { flex: 1; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; font-weight: 700; transition: 0.2s; }
  .nav-btn.active { color: var(--green); }
  .nav-btn span { font-size: 20px; filter: grayscale(1) opacity(0.6); transition: 0.2s; }
  .nav-btn.active span { filter: none; opacity: 1; }

  /* Модалки */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
  .modal { background: white; width: 100%; max-width: 480px; border-radius: 24px 24px 0 0; padding: 24px; animation: slideUp 0.25s ease; max-height: 90vh; overflow-y: auto; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
  .modal-header h3 { font-size: 18px; font-weight: 800; }
  .modal-close { background: var(--gray); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; color: var(--muted); display: flex; align-items: center; justify-content: center; }
  
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
  .field input, .field select { width: 100%; padding: 14px; border: 2px solid var(--gray-2); border-radius: 12px; font-size: 15px; background: var(--gray); }
  .field input:focus { border-color: var(--green); background: white; }
  
  .checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; background: var(--yellow-light); padding: 12px; border-radius: 12px; }
  .checkbox-row input { width: 20px; height: 20px; accent-color: var(--green); }
  .checkbox-row label { font-size: 13px; font-weight: 700; color: #7A5A00; }

  #toast { position: fixed; top: 20px; left: 50%; transform: translate(-50%, -100px); background: var(--green-dark); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 700; font-size: 13px; z-index: 200; transition: 0.3s; box-shadow: 0 10px 24px rgba(0,0,0,0.2); }
  #toast.show { transform: translate(-50%, 0); }
  #toast.error { background: var(--red); }
</style>
</head>
<body>

<!-- ============ ВХОД ============ -->
<section id="scr-auth" class="screen active">
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="display:flex; justify-content:center; margin-bottom:20px;">
        <div class="coin-logo"><div class="coin-spin"><div class="face front"><span class="S">S</span></div><div class="face back"><span class="S">S</span></div></div></div>
      </div>
      <h2>Добро пожаловать</h2>
      <p>Войдите или создайте аккаунт</p>
      
      <div class="input-group">
        <label>Никнейм</label>
        <input id="auth-username" placeholder="Ваш ник" />
      </div>
      <div class="input-group">
        <label>Пароль</label>
        <input id="auth-password" type="password" placeholder="••••••••" />
      </div>
      
      <button class="btn btn-primary" onclick="handleAuth()">Продолжить</button>
      <div class="pin-error" id="auth-error"></div>
    </div>
  </div>
</section>

<!-- ============ PIN ============ -->
<section id="scr-pin" class="screen">
  <div class="auth-wrap">
    <div class="auth-card pin-container">
      <div style="display:flex; justify-content:center; margin-bottom:10px;">
        <div class="coin-logo" style="--size:70px"><div class="coin-spin"><div class="face front"><span class="S">S</span></div><div class="face back"><span class="S">S</span></div></div></div>
      </div>
      <h2 id="pin-title">Создайте PIN</h2>
      <p id="pin-subtitle">4 цифры для быстрого входа</p>
      <div class="pin-dots" id="pin-dots">
        <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div class="pin-pad" id="pin-pad">
        <button class="pin-key" onclick="pinPress('1')">1</button>
        <button class="pin-key" onclick="pinPress('2')">2</button>
        <button class="pin-key" onclick="pinPress('3')">3</button>
        <button class="pin-key" onclick="pinPress('4')">4</button>
        <button class="pin-key" onclick="pinPress('5')">5</button>
        <button class="pin-key" onclick="pinPress('6')">6</button>
        <button class="pin-key" onclick="pinPress('7')">7</button>
        <button class="pin-key" onclick="pinPress('8')">8</button>
        <button class="pin-key" onclick="pinPress('9')">9</button>
        <button class="pin-key empty"></button>
        <button class="pin-key" onclick="pinPress('0')">0</button>
        <button class="pin-key del" onclick="pinDel()">⌫</button>
      </div>
      <div class="pin-error" id="pin-error"></div>
    </div>
  </div>
</section>

<!-- ============ БАНК ============ -->
<section id="scr-app" class="screen">
  <header class="bank-header">
    <div class="header-top">
      <div class="brand-row">
        <div class="coin-logo"><div class="coin-spin"><div class="face front"><span class="S">S</span></div><div class="face back"><span class="S">S</span></div></div></div>
        <div class="brand-name">S Bank</div>
      </div>
      <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>
    <div class="balance-block">
      <div class="balance-label">Общий баланс</div>
      <div class="balance-value" id="total-balance">0 ₽</div>
    </div>
  </header>

  <main class="views">
    <!-- Карты -->
    <div id="view-cards" class="view active">
      <div class="section-title">Мои карты</div>
      <div id="cards-list"></div>
      <button class="create-card-btn" onclick="createCard()">+ Выпустить новую карту</button>
    </div>

    <!-- Биржа -->
    <div id="view-exchange" class="view">
      <div class="tab-switcher">
        <button id="tab-btn-market" class="active" onclick="switchExchangeTab('market')">Рынок</button>
        <button id="tab-btn-orders" onclick="switchExchangeTab('orders')">Заявки</button>
      </div>
      
      <div id="exchange-market">
        <div id="chart-container"></div>
        <div class="tab-switcher" style="background:transparent; box-shadow:none; padding:0; margin-bottom:12px;">
          <button id="btn-type-crypto" class="active" style="background:white; box-shadow:var(--shadow)" onclick="switchAssetType('crypto')">Крипта</button>
          <button id="btn-type-exchange" style="background:white; box-shadow:var(--shadow)" onclick="switchAssetType('exchange')">Акции</button>
        </div>
        <div id="assets-list"></div>
      </div>

      <div id="exchange-orders" style="display:none">
        <div class="tab-switcher">
          <button id="btn-orders-online" class="active" onclick="switchOrdersTab('online')">Онлайн</button>
          <button id="btn-orders-archive" onclick="switchOrdersTab('archive')">Архив</button>
        </div>
        <div id="orders-list"></div>
      </div>
    </div>

    <!-- Оплата -->
    <div id="view-pay" class="view">
      <div class="section-title">Переводы</div>
      <div style="background:white; border-radius:16px; padding:16px; box-shadow:var(--shadow); margin-bottom:16px;">
        <div class="field">
          <label>С карты</label>
          <select id="tr-from"></select>
        </div>
        <div class="field">
          <label>Никнейм получателя</label>
          <input id="tr-to" placeholder="@username" />
        </div>
        <div class="field">
          <label>Сумма (₽)</label>
          <input id="tr-amount" type="number" placeholder="0" />
        </div>
        <button class="btn btn-primary" onclick="submitTransfer()">Отправить</button>
      </div>
    </div>

    <!-- Профиль -->
    <div id="view-profile" class="view">
      <div class="profile-card">
        <div class="profile-head">
          <div class="avatar" id="profile-avatar">S</div>
          <div>
            <div style="font-weight:800; font-size:18px" id="profile-name">@Игрок</div>
            <div style="font-size:12px; color:var(--green); font-weight:700">Игровой профиль</div>
          </div>
        </div>
      </div>

      <div class="profile-card">
        <div class="section-title" style="margin-top:0">🏆 Топ-100 по богатству</div>
        <div id="top-list"></div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchView('cards', this)"><span>💳</span>Карты</button>
    <button class="nav-btn" onclick="switchView('exchange', this)"><span>📈</span>Биржа</button>
    <button class="nav-btn" onclick="switchView('pay', this)"><span>💸</span>Оплата</button>
    <button class="nav-btn" onclick="switchView('profile', this)"><span>👤</span>Профиль</button>
  </nav>
</section>

<div id="modal-root"></div>
<div id="toast"></div>

<script>
/* =========================================================
   КОНФИГУРАЦИЯ
   ========================================================= */
const SUPABASE_URL = 'https://dhllbxfxlnaipfcyhlig.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_g4d9P2f2CGyirvjTvzBkyg_2W4FqxFx';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
const state = {
  user: null, // { id, username, balance }
  pin: null,
  cards: [], // Только визуальные карты
  assets: [
    { symbol: 'BTC', name: 'Bitcoin', type: 'crypto', price: 5000000, change: 1.2 },
    { symbol: 'TON', name: 'Toncoin', type: 'crypto', price: 800, change: -0.5 },
    { symbol: 'ETH', name: 'Ethereum', type: 'crypto', price: 300000, change: 2.1 },
    { symbol: 'SBER', name: 'Сбербанк', type: 'exchange', price: 280, change: 0.8 },
    { symbol: 'GAZP', name: 'Газпром', type: 'exchange', price: 130, change: -1.1 },
  ],
  orders: [],
  chart: null,
  chartSeries: null,
  activeAsset: null,
};

function saveState() {
  localStorage.setItem('sbank_data', JSON.stringify({
    user: state.user, pin: state.pin, cards: state.cards, assets: state.assets, orders: state.orders
  }));
}

function loadState() {
  const raw = localStorage.getItem('sbank_data');
  if (raw) {
    const data = JSON.parse(raw);
    state.user = data.user;
    state.pin = data.pin;
    state.cards = data.cards || [];
    if(data.assets) state.assets = data.assets;
    state.orders = data.orders || [];
  }
}

/* =========================================================
   РЕГИСТРАЦИЯ / ВХОД
   ========================================================= */
async function handleAuth() {
  const u = document.getElementById('auth-username').value.trim().toLowerCase();
  const p = document.getElementById('auth-password').value;

  if (!u || !p) return showError('auth-error', 'Заполните все поля');

  const btn = document.querySelector('#scr-auth .btn-primary');
  const originalText = btn.textContent;
  btn.textContent = 'Загрузка...';

  try {
    // 1. Проверяем, есть ли пользователь
    const { data: existingUser, error } = await supabase
      .from('profiles')
      .select('*')
      .eq('username', u)
      .maybeSingle();

    if (existingUser) {
      // Если пароль не совпадает (для старых аккаунтов, где пароля нет, пускаем)
      if (existingUser.password && existingUser.password !== p) {
        showError('auth-error', 'Неверный пароль');
        btn.textContent = originalText;
        return;
      }
      state.user = { id: existingUser.id, username: existingUser.username, balance: existingUser.balance || 0 };
    } else {
      // 2. Создаем нового (стартовый баланс 3500)
      const { data: newUser, error: insErr } = await supabase
        .from('profiles')
        .insert([{ username: u, password: p, balance: 3500 }])
        .select()
        .single();
      
      if (insErr) throw insErr;
      state.user = { id: newUser.id, username: newUser.username, balance: newUser.balance };
      toast('Аккаунт создан! Начислено 3500 ₽');
    }
    
    saveState();
    showScreen('scr-pin');
    if (!state.pin) {
      setupPin();
    } else {
      loginPin();
    }
  } catch (err) {
    console.error(err);
    showError('auth-error', 'Ошибка базы данных. Попробуйте позже.');
  } finally {
    btn.textContent = originalText;
  }
}

/* =========================================================
   PIN
   ========================================================= */
let enteredPin = '';
let confirmPin = '';
let isConfirming = false;
let tempPin = '';

function setupPin() {
  document.getElementById('pin-title').textContent = 'Создайте PIN';
  document.getElementById('pin-subtitle').textContent = '4 цифры для быстрого входа';
  isConfirming = false;
  enteredPin = '';
  confirmPin = '';
  tempPin = '';
  document.getElementById('pin-error').textContent = '';
  updateDots();
}

function loginPin() {
  document.getElementById('pin-title').textContent = 'Введите PIN';
  document.getElementById('pin-subtitle').textContent = 'Для доступа к банку';
  isConfirming = true;
  confirmPin = '';
  enteredPin = '';
  document.getElementById('pin-error').textContent = '';
  updateDots();
}

function pinPress(d) {
  const target = isConfirming ? confirmPin : enteredPin;
  if (target.length >= 4) return;
  
  if (isConfirming) confirmPin += d;
  else enteredPin += d;

  updateDots();

  if (confirmPin.length === 4 || (!isConfirming && enteredPin.length === 4)) {
    setTimeout(() => {
      if (!isConfirming) {
        tempPin = enteredPin;
        enteredPin = '';
        isConfirming = true;
        document.getElementById('pin-title').textContent = 'Повторите PIN';
        document.getElementById('pin-subtitle').textContent = 'Для подтверждения';
        updateDots();
      } else {
        if (state.pin) {
          if (confirmPin === state.pin) enterApp();
          else {
            showError('pin-error', 'Неверный PIN');
            confirmPin = ''; updateDots();
          }
        } else {
          if (confirmPin === tempPin) {
            state.pin = confirmPin;
            saveState();
            enterApp();
          } else {
            showError('pin-error', 'PIN не совпадает');
            confirmPin = ''; enteredPin = ''; isConfirming = false;
            document.getElementById('pin-title').textContent = 'Создайте PIN';
            document.getElementById('pin-subtitle').textContent = '4 цифры для входа';
            updateDots();
          }
        }
      }
    }, 200);
  }
}

function pinDel() {
  if (isConfirming) confirmPin = confirmPin.slice(0, -1);
  else enteredPin = enteredPin.slice(0, -1);
  updateDots();
}

function updateDots() {
  const len = isConfirming ? confirmPin.length : enteredPin.length;
  document.querySelectorAll('.pin-dot').forEach((dot, i) => {
    dot.classList.toggle('filled', i < len);
  });
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  setTimeout(() => el.textContent = '', 3000);
}

function enterApp() {
  showScreen('scr-app');
  document.getElementById('profile-name').textContent = '@' + state.user.username;
  document.getElementById('profile-avatar').textContent = state.user.username[0].toUpperCase();
  
  // Если нет карт, создаем одну при входе
  if (state.cards.length === 0) {
    createCard(false); 
  }
  
  renderCards();
  renderExchange();
  renderProfile();
  syncAssets();
}

function logout() {
  location.reload();
}

/* =========================================================
   НАВИГАЦИЯ
   ========================================================= */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function switchView(view, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  if (view === 'exchange') setTimeout(initChart, 100); 
  if (view === 'profile') renderProfile();
}

/* =========================================================
   КАРТЫ И БАЛАНС
   ========================================================= */
function renderCards() {
  const list = document.getElementById('cards-list');
  
  // Берем баланс из базы, а не из карт
  document.getElementById('total-balance').textContent = fmtMoney(state.user.balance) + ' ₽';

  // Обновляем селект в переводах
  const select = document.getElementById('tr-from');
  if (select) {
    select.innerHTML = state.cards.map(c => 
      `<option value="${c.id}">${c.name} (Баланс: ${fmtMoney(state.user.balance)} ₽)</option>`
    ).join('');
  }

  if (state.cards.length === 0) {
    list.innerHTML = '<div style="text-align:center; padding:20px; color:var(--muted); font-size:13px;">У вас пока нет карт</div>';
    return;
  }

  list.innerHTML = state.cards.map(c => `
    <div class="vcard ${state.user.balance < 0 ? 'negative' : ''}">
      <div class="vc-top">
        <div class="vc-name">${c.name}</div>
        <div class="vc-delete" onclick="deleteCard('${c.id}')">Удалить</div>
      </div>
      <div class="vc-number">${c.number}</div>
      <div class="vc-balance">${fmtMoney(state.user.balance)} ₽</div>
    </div>
  `).join('');
}

function createCard(showToast = true) {
  if (state.cards.length >= 10) return toast('Максимум 10 карт', true);
  const num = '2200' + Math.floor(100000000000 + Math.random() * 900000000000);
  state.cards.push({ 
    id: Date.now().toString(), 
    name: 'Карта ' + (state.cards.length + 1), 
    number: num.replace(/(.{4})/g, '$1 ').trim()
  });
  saveState();
  renderCards();
  if (showToast) toast('Карта выпущена');
}

function deleteCard(id) {
  if (state.cards.length <= 1) return toast('Нельзя удалить последнюю карту', true);
  
  if(confirm('Вы уверены, что хотите удалить карту?')) {
    state.cards = state.cards.filter(c => c.id !== id);
    saveState();
    renderCards();
    toast('Карта удалена');
  }
}

/* =========================================================
   БИРЖА
   ========================================================= */
let currentExchangeTab = 'market';
let currentAssetType = 'crypto';
let currentOrdersTab = 'online';

function switchExchangeTab(tab) {
  currentExchangeTab = tab;
  document.getElementById('tab-btn-market').classList.toggle('active', tab === 'market');
  document.getElementById('tab-btn-orders').classList.toggle('active', tab === 'orders');
  document.getElementById('exchange-market').style.display = tab === 'market' ? 'block' : 'none';
  document.getElementById('exchange-orders').style.display = tab === 'orders' ? 'block' : 'none';
  
  if(tab === 'market') setTimeout(initChart, 100);
}

function switchAssetType(type) {
  currentAssetType = type;
  document.getElementById('btn-type-crypto').classList.toggle('active', type === 'crypto');
  document.getElementById('btn-type-exchange').classList.toggle('active', type === 'exchange');
  renderAssetsList();
}

function renderExchange() {
  renderAssetsList();
  renderOrdersList();
}

function renderAssetsList() {
  const list = document.getElementById('assets-list');
  const assets = state.assets.filter(a => a.type === currentAssetType);
  
  list.innerHTML = assets.map(a => `
    <div class="asset-item" onclick="openBuyModal('${a.symbol}')">
      <div class="asset-icon">${a.symbol[0]}</div>
      <div class="asset-info">
        <div class="asset-symbol">${a.symbol}</div>
        <div style="font-size:12px; color:var(--muted)">${a.name}</div>
      </div>
      <div class="asset-price">
        <div class="asset-price-value">${fmtMoney(a.price)} ₽</div>
        <div style="font-size:11px; color:${a.change >= 0 ? 'var(--green)' : 'var(--red)'}">${a.change >= 0 ? '+' : ''}${a.change}%</div>
      </div>
    </div>
  `).join('');

  if (!state.activeAsset && assets.length) selectAsset(assets[0].symbol, false);
}

function initChart() {
  if (!state.activeAsset) return;
  const container = document.getElementById('chart-container');
  if(!container) return;
  
  if (!state.chart) {
    state.chart = LightweightCharts.createChart(container, {
      width: container.clientWidth,
      height: 220,
      layout: { background: { color: '#ffffff' }, textColor: '#6B7A72' },
      grid: { vertLines: { color: '#F4F6F5' }, horzLines: { color: '#F4F6F5' } },
      rightPriceScale: { borderVisible: false },
      timeScale: { borderVisible: false, timeVisible: true },
      handleScroll: false,
      handleScale: false,
    });
    state.chartSeries = state.chart.addAreaSeries({ 
      lineColor: '#00A651', 
      topColor: 'rgba(0,166,81,0.2)', 
      bottomColor: 'rgba(0,166,81,0)' 
    });
  } else {
    state.chart.applyOptions({ width: container.clientWidth });
  }
  
  selectAsset(state.activeAsset, false);
}

function selectAsset(symbol, openModal = true) {
  state.activeAsset = symbol;
  const asset = state.assets.find(a => a.symbol === symbol);
  if(!asset) return;
  
  const data = [];
  let base = asset.price * 0.9;
  for (let i = 30; i >= 0; i--) {
    base = base * (1 + (Math.random() - 0.5) * 0.04);
    data.push({ 
      time: new Date(Date.now() - i * 86400000).toISOString().split('T')[0], 
      value: Math.max(1, base) 
    });
  }
  data.push({ time: new Date().toISOString().split('T')[0], value: asset.price });
  
  if (state.chartSeries) state.chartSeries.setData(data);
  
  if (openModal) openBuyModal(symbol);
}

function openBuyModal(symbol) {
  const asset = state.assets.find(a => a.symbol === symbol);
  const body = `
    <div style="text-align:center; margin-bottom:20px">
      <div style="font-size:32px; font-weight:900">${asset.symbol}</div>
      <div style="font-size:14px; color:var(--muted)">${asset.name}</div>
      <div style="font-size:20px; font-weight:800; color:var(--green); margin-top:8px">${fmtMoney(asset.price)} ₽</div>
    </div>
    <div class="field">
      <label>Сумма покупки (₽)</label>
      <input id="buy-amount" type="number" placeholder="100" />
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="buy-schedule" onchange="document.getElementById('schedule-time').style.display = this.checked ? 'block' : 'none'">
      <label for="buy-schedule">⏰ Установить срок (автозакрытие)</label>
    </div>
    <div id="schedule-time" style="display:none; margin-bottom:14px;">
      <input type="datetime-local" id="buy-time" class="field" style="width:100%; padding:14px; border:2px solid var(--gray-2); border-radius:12px;">
    </div>
    <button class="btn btn-primary" onclick="executeBuy('${symbol}')">Купить</button>
  `;
  openModal('Покупка', body);
}

async function executeBuy(symbol) {
  const asset = state.assets.find(a => a.symbol === symbol);
  const amount = Number(document.getElementById('buy-amount').value);
  if (!amount || amount <= 0) return toast('Введите сумму', true);
  
  const hasSchedule = document.getElementById('buy-schedule').checked;
  const timeVal = document.getElementById('buy-time').value;
  
  if (hasSchedule && !timeVal) return toast('Укажите время закрытия', true);

  if (state.user.balance < amount) return toast('Недостаточно средств', true);

  const btn = document.querySelector('#modal-root .btn-primary');
  btn.textContent = 'Покупка...';

  try {
    // Списываем в базе
    const newBalance = state.user.balance - amount;
    const { error } = await supabase.from('profiles').update({ balance: newBalance }).eq('id', state.user.id);
    if (error) throw error;

    state.user.balance = newBalance;
    saveState();

    state.orders.push({
      id: Date.now().toString(),
      symbol: asset.symbol,
      amount: amount,
      qty: amount / asset.price,
      buyPrice: asset.price,
      status: 'open',
      schedule: hasSchedule ? new Date(timeVal).getTime() : null,
      date: Date.now()
    });

    saveState();
    closeModal();
    renderCards();
    renderOrdersList();
    toast('Актив успешно куплен!');
  } catch (e) {
    console.error(e);
    toast('Ошибка при покупке', true);
    btn.textContent = 'Купить';
  }
}

/* =========================================================
   ЗАЯВКИ
   ========================================================= */
function switchOrdersTab(tab) {
  currentOrdersTab = tab;
  document.getElementById('btn-orders-online').classList.toggle('active', tab === 'online');
  document.getElementById('btn-orders-archive').classList.toggle('active', tab === 'archive');
  renderOrdersList();
}

function renderOrdersList() {
  const list = document.getElementById('orders-list');
  if (!list) return;
  
  const filtered = state.orders.filter(o => currentOrdersTab === 'online' ? o.status === 'open' : o.status === 'closed');

  if (filtered.length === 0) {
    list.innerHTML = `<div style="text-align:center; padding:40px 20px; color:var(--muted); font-size:13px;">Нет ${currentOrdersTab === 'online' ? 'активных заявок' : 'записей в архиве'}</div>`;
    return;
  }

  list.innerHTML = filtered.map(o => {
    const asset = state.assets.find(a => a.symbol === o.symbol) || { price: o.buyPrice };
    const pnl = o.status === 'closed' ? (o.sellPrice - o.buyPrice) * o.qty : 0;
    
    if (currentOrdersTab === 'online') {
      return `
        <div class="order-item">
          <div class="order-head">
            <span>${o.symbol}</span>
            <span style="color:var(--green)">Онлайн</span>
          </div>
          <div class="order-body">
            Куплено на: ${fmtMoney(o.amount)} ₽<br>
            ${o.schedule ? `⏰ Срок: ${new Date(o.schedule).toLocaleString('ru-RU')}` : 'Без срока'}
          </div>
          ${o.schedule 
            ? `<button class="order-btn fee" onclick="closeOrder('${o.id}', 0.10)">Закрыть (−10%)</button>`
            : `<button class="order-btn free" onclick="closeOrder('${o.id}', 0)">Закрыть без %</button>`
          }
        </div>
      `;
    } else {
      return `
        <div class="order-item">
          <div class="order-head">
            <span>${o.symbol}</span>
            <span style="color:var(--muted)">Архив</span>
          </div>
          <div class="order-body">
            Продано на: ${fmtMoney(o.qty * o.sellPrice)} ₽<br>
            Фин. рез-т: <b style="color:${pnl >= 0 ? 'var(--green)' : 'var(--red)'}">${pnl >= 0 ? '+' : ''}${fmtMoney(pnl)} ₽</b>
          </div>
        </div>
      `;
    }
  }).join('');
}

async function closeOrder(id, feePct) {
  const order = state.orders.find(o => o.id === id);
  const asset = state.assets.find(a => a.symbol === order.symbol);
  const sellValue = order.qty * asset.price;
  const fee = sellValue * feePct;
  const net = sellValue - fee;

  try {
    const newBalance = state.user.balance + net;
    const { error } = await supabase.from('profiles').update({ balance: newBalance }).eq('id', state.user.id);
    if (error) throw error;

    state.user.balance = newBalance;
    order.status = 'closed';
    order.sellPrice = asset.price;
    
    saveState();
    renderCards();
    renderOrdersList();
    
    if (fee > 0) {
      toast(`Закрыто. Комиссия ${fmtMoney(fee)} ₽ (10%). Зачислено ${fmtMoney(net)} ₽`);
    } else {
      toast(`Закрыто. Зачислено: ${fmtMoney(net)} ₽`);
    }
  } catch (e) {
    console.error(e);
    toast('Ошибка при закрытии', true);
  }
}

/* =========================================================
   ПЕРЕВОДЫ
   ========================================================= */
async function submitTransfer() {
  const toNick = document.getElementById('tr-to').value.replace('@', '').trim().toLowerCase();
  const amount = Number(document.getElementById('tr-amount').value);

  if (!toNick || !amount || amount <= 0) return toast('Заполните поля корректно', true);
  if (state.user.balance < amount) return toast('Недостаточно средств', true);
  if (toNick === state.user.username) return toast('Нельзя перевести самому себе', true);

  const btn = document.querySelector('#view-pay .btn-primary');
  const originalText = btn.textContent;
  btn.textContent = 'Отправка...';
  
  try {
    // 1. Ищем получателя
    const { data: target, error: findError } = await supabase
      .from('profiles')
      .select('id, balance')
      .eq('username', toNick)
      .maybeSingle();

    if (findError) throw findError;
    if (!target) {
      btn.textContent = originalText;
      return toast('Пользователь не найден в базе', true);
    }

    // 2. Списываем у себя
    const myNewBalance = state.user.balance - amount;
    const { error: err1 } = await supabase.from('profiles').update({ balance: myNewBalance }).eq('id', state.user.id);
    if (err1) throw err1;

    // 3. Начисляем получателю
    const targetNewBalance = (target.balance || 0) + amount;
    const { error: err2 } = await supabase.from('profiles').update({ balance: targetNewBalance }).eq('id', target.id);
    if (err2) throw err2;

    // 4. Обновляем локально
    state.user.balance = myNewBalance;
    saveState();
    renderCards();
    document.getElementById('tr-amount').value = '';
    
    toast(`Перевод @${toNick} выполнен!`);
  } catch (e) {
    console.error(e);
    toast('Ошибка при переводе', true);
  } finally {
    btn.textContent = originalText;
  }
}

/* =========================================================
   ПРОФИЛЬ И ТОП-100 (ИЗ БАЗЫ)
   ========================================================= */
async function renderProfile() {
  const list = document.getElementById('top-list');
  if (!list) return;
  
  list.innerHTML = '<div style="text-align:center; color:var(--muted); padding:10px;">Загрузка топа...</div>';

  try {
    const { data: topUsers } = await supabase
      .from('profiles')
      .select('username, balance')
      .order('balance', { ascending: false })
      .limit(100);

    if (!topUsers || topUsers.length === 0) {
      list.innerHTML = '<div style="text-align:center; color:var(--muted); padding:10px;">Пока нет игроков</div>';
      return;
    }

    // Ищем себя, если не попали в топ
    let topList = [...topUsers];
    const inTop = topList.find(u => u.username === state.user.username);
    
    if (!inTop) {
      topList.push({ username: state.user.username, balance: state.user.balance });
      topList.sort((a,b) => b.balance - a.balance);
    }

    list.innerHTML = topList.map((u, i) => {
      const isMe = u.username === state.user.username;
      return `
        <div class="top-item ${isMe ? 'top-you' : ''}">
          <div class="top-rank" style="${isMe ? 'color:var(--green)' : ''}">${i+1}</div>
          <div class="top-name">@${u.username} ${isMe ? '(Вы)' : ''}</div>
          <div class="top-balance">${fmtMoney(u.balance)} ₽</div>
        </div>
      `;
    }).join('');
  } catch (e) {
    list.innerHTML = '<div style="text-align:center; color:var(--red); padding:10px;">Ошибка загрузки</div>';
  }
}

/* =========================================================
   ХЕЛПЕРЫ
   ========================================================= */
function fmtMoney(n) { 
  return Number(n || 0).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); 
}

function toast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = err ? 'show error' : 'show';
  setTimeout(() => t.className = '', 3000);
}

function openModal(title, body) {
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        ${body}
      </div>
    </div>`;
}

function closeModal() { 
  document.getElementById('modal-root').innerHTML = ''; 
}

/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================= */
document.addEventListener('DOMContentLoaded', () => {
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  loadState();

  if (state.user && state.pin) {

  window.addEventListener('resize', () => {
    if (state.chart && document.getElementById('chart-container')) {
      state.chart.applyOptions({ width: document.getElementById('chart-container').clientWidth });
    }
  });
});
